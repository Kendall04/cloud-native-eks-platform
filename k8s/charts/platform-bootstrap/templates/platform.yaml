apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-db-ca
  namespace: apps
data:
  rds-global-bundle.pem: |
{{ .Files.Get "files/rds-global-bundle.pem" | indent 4 }}
{{- range $name := list "auth" "shipment" "tracking" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-service
  namespace: apps
{{- if ne $name "auth" }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "workload role required" (index $.Values.workloadRoles $name) | quote }}
{{- end }}
automountServiceAccountToken: false
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-migrator
  namespace: apps
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: platform-aws
  namespace: apps
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-deployer
  namespace: apps
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["keda.sh"]
    resources: ["triggerauthentications"]
    resourceNames: ["shipment-sqs-metrics"]
    verbs: ["get"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-deployer
  namespace: apps
subjects:
  - kind: Group
    name: platform:deployer:apps
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: platform-deployer
  apiGroup: rbac.authorization.k8s.io
