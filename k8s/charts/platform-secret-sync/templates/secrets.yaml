{{- range $name := list "auth-runtime-db" "auth-migration-db" "shipment-runtime-db" "shipment-migration-db" "tracking-runtime-db" "tracking-migration-db" "bootstrap-admin" "auth-jwt" "gateway-trust" "internal-trust" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: apps
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: platform-aws
    kind: SecretStore
  target:
    name: {{ $name }}
    creationPolicy: Owner
    deletionPolicy: Retain
{{- if or (hasSuffix "-db" $name) (eq $name "bootstrap-admin") }}
  dataFrom:
    - extract:
        key: {{ required "secret ARN required" (index $.Values.secretArns $name) | quote }}
{{- else }}
  data:
    - secretKey: value
      remoteRef:
        key: {{ required "secret ARN required" (index $.Values.secretArns $name) | quote }}
{{- end }}
{{- end }}
