name: Validate

on:
  workflow_call:
    inputs:
      skip_containers:
        description: Publisher builds and scans the images once in its own job
        type: boolean
        default: false
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - develop
      - main

permissions:
  contents: read

# Unique caller name prevents reusable calls cancelling their parent workflow.
concurrency:
  # A title/body edit must not cancel source validation already in progress.
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && '-metadata' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  frontend:
    # Metadata-only title/body edits do not change tested source; retargeted bases do.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify pinned Node and bundled npm
        run: |
          test "$(node --version)" = "v$(cat .node-version)"
          test "$(npm --version)" = "$(node -p 'require("./package.json").packageManager.split("@")[1]')"
          node --version
          npm --version
          google-chrome --version
          mkdir -p ../.validation-results/frontend
      - name: Restore locked npm dependencies
        run: npm ci --no-audit --no-fund
      - name: Reject inconsistent dependency locks
        run: npm run check:lock
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Unit, component and proxy tests
        run: npm test -- --reporter=default --reporter=junit --outputFile=../.validation-results/frontend/unit.xml
      - name: Production build
        run: npm run build
      - name: Archify integrity, sanitization and build secret patterns
        run: npm run check:architecture
      - name: Dependency security
        run: npm audit --json > ../.validation-results/frontend/npm-audit.json
      - name: Current-tree secret scan
        working-directory: .
        run: python3 scripts/validation/secret_scan.py
      - name: Product Demo and Architecture Explorer in Chrome
        env:
          CI: 'true'
          UI_TEST_MODE: portfolio
          UI_TEST_URL: http://127.0.0.1:4175
        run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-validation
          path: .validation-results/frontend/
          if-no-files-found: warn
          retention-days: 7

  pull-request-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate branch flow
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "${BASE_REF}" == "main" && ( "${HEAD_REF}" != "develop" || "${HEAD_REPO}" != "${BASE_REPO}" ) ]]; then
            echo "Pull requests into main must come from this repository's develop branch." >&2
            echo "Retarget Dependabot security PRs to develop; all technical checks still apply." >&2
            exit 1
          fi

      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          regex='^(build|chore|ci|docs|feat|fix|perf|refactor|release|revert|style|test)\([^)]+\)(!)?: .+'

          if [[ ! "${TITLE}" =~ ${regex} ]]; then
            echo "PR titles must follow Conventional Commits and include a scope." >&2
            echo "Example: feat(auth): add refresh token rotation" >&2
            exit 1
          fi

      - name: Validate commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Conventional Commits permits an optional scope. PR titles above
          # still require one, including the title used for a squash merge.
          regex='^(build|chore|ci|docs|feat|fix|perf|refactor|release|revert|style|test)(\([^)]+\))?(!)?: .+'

          while IFS= read -r subject; do
            [[ -z "${subject}" ]] && continue

            if [[ ! "${subject}" =~ ${regex} ]]; then
              echo "Commit subject does not follow Conventional Commits: ${subject}" >&2
              exit 1
            fi
          done < <(git log --no-merges --format=%s "${BASE_SHA}..${HEAD_SHA}")

  dotnet-tests:
    # Metadata-only title/body edits do not change tested source; retargeted bases do.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        solution:
          - microservices/auth-service/AuthService.sln
          - microservices/shipment-service/ShipmentService.sln
          - microservices/tracking-service/TrackingService.sln
          - tests/EventReliability.Tests/EventReliability.Tests.csproj
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore "${{ matrix.solution }}" --locked-mode

      - name: Reject dependency changes without a matching lock
        if: matrix.solution == 'microservices/auth-service/AuthService.sln'
        run: python3 scripts/validation/verify_locked_restore.py

      - name: Build
        run: dotnet build "${{ matrix.solution }}" --configuration Release --no-restore

      - name: Test
        run: dotnet test "${{ matrix.solution }}" --configuration Release --no-build --no-restore --logger trx --results-directory .validation-results/trx

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tests-${{ strategy.job-index }}
          path: .validation-results/trx/*.trx
          if-no-files-found: warn
          retention-days: 14

  helm-and-release-metadata:
    # Metadata-only title/body edits do not change tested source; retargeted bases do.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Historical RC2/RC3 contract tests read exact ancestor commits.

      - name: Validate release service metadata
        run: jq -e '.services | length > 0' release/services.json >/dev/null

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            scripts/bootstrap/requirements.txt
            scripts/ci/requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Authorizer contract tests
        run: node --test lambdas/api-gateway-jwt-authorizer/src/index.test.mjs

      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a
        with:
          version: v4.2.2

      - name: Lint platform-services chart
        run: helm lint ./k8s/charts/platform-services -f ./k8s/environments/dev/platform-services.values.yaml -f scripts/validation/fixtures/helm-infra.values.yaml

      - name: Render platform-services chart with dev overlay
        run: |
          helm template platform-services \
            ./k8s/charts/platform-services \
            -f ./k8s/environments/dev/platform-services.values.yaml -f scripts/validation/fixtures/helm-infra.values.yaml >/dev/null

      - name: Install lightweight contract validators
        run: python -m pip install -r scripts/bootstrap/requirements.txt

      - name: Validate R1 runtime and edge contracts
        run: python scripts/validation/validate_r1.py

      - name: Restore pinned addon charts for regression detectors
        run: python scripts/validation/helm_dependencies.py


      - name: Validate R3 secret and authorization contracts
        run: python scripts/validation/validate_r3.py

      - name: Validate R3 addon dependency and scoped ESO render
        run: |
          helm lint k8s/charts/cluster-addons
          helm template cluster-addons k8s/charts/cluster-addons -n kube-system > /tmp/addons.yaml
          python scripts/validation/validate_r3.py --addons /tmp/addons.yaml

      - name: Validate R2 infrastructure and bootstrap contracts
        run: python scripts/validation/validate_r2.py

      - name: Validate R4 private CD security contracts
        run: python scripts/validation/validate_r4.py

      - name: Validate R7 closure and current-tree secret scan
        run: |
          python scripts/validation/validate_r7.py
          python scripts/validation/secret_scan.py

      - name: Validate R6 scaling and observability contracts
        run: python scripts/validation/validate_r6.py

      - name: Validate R5 event reliability contracts
        run: python scripts/validation/validate_r5.py

  r2-terraform-contracts:
    # Metadata-only title/body edits do not change tested source; retargeted bases do.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: [apigateway-core, apigateway-integration, authorizer-secrets, ecr, eks, event-encryption, eventbridge, iam, lambda, management-host, nat, nat-egress, observability, private-cd, rds, runtime-secrets, s3, sqs, vpc]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.13.4
      - name: Validate R2 module without backend
        working-directory: infra/modules/${{ matrix.module }}
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
      - name: Offline discovery plan tests
        if: matrix.module == 'apigateway-integration' || matrix.module == 'private-cd' || matrix.module == 'management-host' || matrix.module == 'observability'
        working-directory: infra/modules/${{ matrix.module }}
        run: terraform test

      - name: Authorizer clean and contaminated archive regression
        if: matrix.module == 'lambda'
        run: python3 scripts/validation/verify_lambda_package.py
      - name: Authorizer runtime-provided SDK resolution
        if: matrix.module == 'lambda'
        run: >-
          docker run --rm --entrypoint node
          -e NODE_PATH=/opt/nodejs/node22/node_modules:/opt/nodejs/node_modules:/var/runtime/node_modules:/var/runtime:/var/task
          -v "$PWD/lambdas/api-gateway-jwt-authorizer/src/index.mjs:/var/task/src/index.mjs:ro"
          public.ecr.aws/lambda/nodejs:22 --input-type=module -e
          "const handler = await import('/var/task/src/index.mjs');
          const sdk = await import('@aws-sdk/client-secrets-manager');
          if (typeof handler.handler !== 'function' || typeof sdk.SecretsManagerClient !== 'function') process.exit(1);"

  postgres-r3-permissions:
    # Metadata-only title/body edits do not change tested source; retargeted bases do.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15.18
        env:
          POSTGRES_DB: platform
          # Disposable local permission test only. No runtime credential is used.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d platform"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            scripts/bootstrap/requirements.txt
            scripts/ci/requirements.txt
      - run: python -m pip install -r scripts/bootstrap/requirements.txt
      - name: Real PostgreSQL role and default-privilege tests
        env:
          R3_POSTGRES_TEST_DSN: host=127.0.0.1 port=5432 user=postgres dbname=platform
        run: python scripts/validation/postgres_gate.py r3

  postgres-r5-reliability:
    # Metadata-only title/body edits do not change tested source; retargeted bases do.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15.18
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            scripts/bootstrap/requirements.txt
            scripts/ci/requirements.txt
      - run: python -m pip install -r scripts/bootstrap/requirements.txt
      - name: Real PostgreSQL atomicity, ordering and Q2 refresh concurrency tests
        env:
          R5_POSTGRES_DSN: Host=127.0.0.1;Port=5432;Username=postgres;Database=postgres
        run: |
          test -n "$R5_POSTGRES_DSN"
          dotnet restore tests/EventReliability.Tests/EventReliability.Tests.csproj --locked-mode
          dotnet test tests/EventReliability.Tests/EventReliability.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=r5.trx"
          python scripts/validation/postgres_gate.py trx tests/EventReliability.Tests/TestResults/r5.trx

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tests-postgres-reliability
          path: tests/EventReliability.Tests/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14

      # Reuse this job's PostgreSQL service, .NET SDK and restored NuGet cache.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore UI integration dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Prepare disposable UI database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec "$POSTGRES_CONTAINER" createdb -U postgres platform_ui_ci
      - name: Real HTTP, authorization and browser integration
        working-directory: frontend
        env:
          CI: 'true'
        run: npm run test:api:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-http-integration
          path: |
            .validation-results/frontend-api/http.json
            .validation-results/frontend-api/browser.xml
          if-no-files-found: warn
          retention-days: 7

  format-and-workflow-lint:
    # Metadata-only title/body edits do not change tested source; retargeted bases do.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.13.4
      - name: Install reviewed lint tools
        run: |
          curl -fsSL https://github.com/gruntwork-io/terragrunt/releases/download/v0.93.3/terragrunt_linux_amd64 -o "$RUNNER_TEMP/terragrunt"
          echo "017c0417dd6d4bedac830766cc16ea52d8a02d02ca2452bc80b581ed0a993775  $RUNNER_TEMP/terragrunt" | sha256sum --check --status
          sudo install "$RUNNER_TEMP/terragrunt" /usr/local/bin/terragrunt
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          sudo install "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz -o "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP" shellcheck-v0.11.0/shellcheck
          sudo install "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck
      - name: Format and workflow contracts
        run: |
          terraform fmt -check -recursive
          terragrunt hcl fmt --check
          actionlint -pyflakes=
          shellcheck scripts/ci/*.sh scripts/*.sh infra/scripts/eks/*.sh
          git diff --check

  regression-tests:
    # Metadata-only title/body edits do not change tested source; retargeted bases do.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            scripts/bootstrap/requirements.txt
            scripts/ci/requirements.txt
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a
        with:
          version: v4.2.2
      - run: python -m pip install -r scripts/bootstrap/requirements.txt -r scripts/ci/requirements.txt
      - run: python scripts/validation/helm_dependencies.py
      - run: python -B scripts/ci/regressions.py all

  source-security:
    # Metadata-only title/body edits do not change tested source; retargeted bases do.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            scripts/bootstrap/requirements.txt
            scripts/ci/requirements.txt
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a
        with:
          version: v4.2.2
      - run: python -m pip install -r scripts/bootstrap/requirements.txt -r scripts/ci/requirements.txt
      - run: python scripts/validation/helm_dependencies.py
      - run: bash scripts/ci/install-tools.sh
      - run: python scripts/ci/security.py source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: source-security
          path: .validation-results/security/
          if-no-files-found: error
          retention-days: 14

  containers:
    if: ${{ !inputs.skip_containers && (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        service: [auth, shipment, tracking]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/ci/requirements.txt
      - run: python -m pip install -r scripts/ci/requirements.txt
      - run: bash scripts/ci/install-tools.sh
      - name: Build once locally and scan without publishing
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          docker build --platform linux/amd64 --provenance=false --sbom=false --build-arg SOURCE_COMMIT="$GITHUB_SHA" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "cnp-ci/$SERVICE:$GITHUB_SHA" "microservices/$SERVICE-service"
          python scripts/ci/security.py image --service "$SERVICE" \
            --image "cnp-ci/$SERVICE:$GITHUB_SHA" --output ".validation-results/security/$SERVICE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: container-security-${{ matrix.service }}
          path: .validation-results/security/
          if-no-files-found: warn
          retention-days: 14
