name: Build SHA Images
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      skip_containers: true
  build:
    needs: validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [auth, shipment, tracking]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/bootstrap/requirements.txt -r scripts/ci/requirements.txt
      - run: bash scripts/ci/install-tools.sh
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.ARTIFACT_PUBLISHER_ROLE_ARN }}
      - name: Verify AWS account
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          identity="$(aws sts get-caller-identity --output json)"
          jq -e --arg expected "$EXPECTED_AWS_ACCOUNT_ID" '.Account == $expected' <<< "$identity" >/dev/null
          jq '{Account, Arn}' <<< "$identity"
      - name: Build once and record immutable digest
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: python scripts/cd/publish.py build --service '${{ matrix.service }}'
      - name: Scan the published digest before the build can pass
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          image=$(jq -r '.imageRepository + "@" + .imageDigest' "image-$SERVICE.json")
          digest=$(jq -r '.imageDigest' "image-$SERVICE.json")
          registry=$(jq -r '.imageRepository | split("/")[0]' "image-$SERVICE.json")
          DOCKER_CONFIG=$(mktemp -d /dev/shm/cnp-scan.XXXXXX)
          export DOCKER_CONFIG
          cleanup() {
            docker logout "$registry" >/dev/null 2>&1 || true
            rm -f "$DOCKER_CONFIG/config.json"
            rmdir "$DOCKER_CONFIG"
          }
          trap cleanup EXIT
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          docker pull "$image"
          python scripts/ci/security.py image --service "$SERVICE" --image "$image" \
            --registry-digest "$digest" --output ".validation-results/security/$SERVICE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.service }}-${{ github.sha }}
          path: image-${{ matrix.service }}.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: published-security-${{ matrix.service }}-${{ github.sha }}
          path: .validation-results/security/${{ matrix.service }}/
          if-no-files-found: warn
          retention-days: 14
