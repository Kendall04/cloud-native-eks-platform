name: Create Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed release version (vMAJOR.MINOR.PATCH); images must already exist for this main commit
        type: string
        required: true
      migration_compatibility:
        description: Reviewer assertion; Helm rollback never rolls back PostgreSQL
        type: choice
        required: true
        options: [previous-release-compatible]
permissions:
  contents: read
concurrency:
  group: publish-dev-${{ github.sha }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/bootstrap/requirements.txt
      - name: Install verified Helm
        run: |
          curl -fsSL https://get.helm.sh/helm-v4.2.2-linux-amd64.tar.gz -o "$RUNNER_TEMP/helm.tar.gz"
          echo "9adafecab4d406853bba163a70e9f104f47dbbf65ce24b7653bae7e36150bcb6  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.ARTIFACT_PUBLISHER_ROLE_ARN }}
      - name: Verify AWS account
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          identity="$(aws sts get-caller-identity --output json)"
          jq -e --arg expected "$EXPECTED_AWS_ACCOUNT_ID" '.Account == $expected' <<< "$identity" >/dev/null
          jq '{Account, Arn}' <<< "$identity"
      - name: Verify validated builds and publish data-only bundle
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          RELEASE_VERSION: ${{ inputs.version }}
          MIGRATION_COMPATIBILITY: ${{ inputs.migration_compatibility }}
          ENVIRONMENT_CONTRACT_KEY: ${{ vars.ENVIRONMENT_CONTRACT_KEY }}
          ENVIRONMENT_CONTRACT_VERSION: ${{ vars.ENVIRONMENT_CONTRACT_VERSION }}
          ENVIRONMENT_CONTRACT_SHA256: ${{ vars.ENVIRONMENT_CONTRACT_SHA256 }}
        run: python scripts/cd/publish.py release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ inputs.version }}-${{ github.sha }}
          path: |
            publication-receipt.json
            release-manifest.json
          if-no-files-found: error
